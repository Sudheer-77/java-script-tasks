<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("Enter a number:"));
        function checkNumber(num) {
            if (num > 0) {
                return "Positive";
            } else if (num < 0) {
                return "Negative";
            } else {
                return "Zero";
            }
        }
        console.log(checkNumber(number));
    </script>
</body>
</html>
