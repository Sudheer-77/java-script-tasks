v<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>

<body>

<script>

    let maths = parseInt(prompt("Enter Maths marks"));
    let java = parseInt(prompt("Enter Java marks"));
    let sql = parseInt(prompt("Enter SQL marks"));

    if (maths < 35 || java < 35 || sql < 35) {

        console.log("Fail");

    } else {

        let total = maths + java + sql;
        let average = total / 3;

        if (average >= 90) {
            console.log("Excellent");
        }
        else if (average >= 75) {
            console.log("Very Good");
        }
        else if (average >= 60) {
            console.log("Good");
        }
        else if (average >= 50) {
            console.log("Pass");
        }
        else {
            console.log("Fail");
        }
    }

</script>

</body>
</html>
